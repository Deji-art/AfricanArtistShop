<main id="kidartists"><div class="sectionhead"><div><div class="kicker">AGES 12–16</div><h2>Shop from Kid Artists</h2><p class="muted sub">Discover young creators aged 12–16. Parent/guardian involvement should apply to registration, sales and delivery.</p></div><button class="btn primary" onclick="openArtistApplyKid()">Register as a Kid Artist</button></div><div class="grid" id="kidGrid"></div></main>

<main id="contact"><div class="panel"><div class="kicker">CONTACT US</div><h2>Orders, artists & delivery</h2><p class="muted">For an order, the customer provides their WhatsApp number and delivery address during checkout. That information is included with the order and sent to WhatsApp for confirmation.</p></div></main><div class="audience" id="shop-products">
  <div class="aud-card kid"><div class="aud-tag">AGES 12–16</div><h2>Young Creators</h2><p>Discover artworks made by young artists and shop age-appropriate creative materials.</p><div><a class="btn primary" href="#kids">Shop from Kid Artists</a> <a class="btn" href="#kid-register">Register as a Kid Artist</a></div></div>
  <div class="aud-card adult"><div class="aud-tag">ADULT ARTISTS</div><h2>Professional Artists</h2><p>Explore established artists, original collections and professional studio materials.</p><div><a class="btn primary" href="#adults">Shop from Artists</a> <a class="btn" href="#adult-register">Register as an Artist</a></div></div>
</div>
<div class="delivery-strip"><b>📍 Delivery to you</b><span>Enter your delivery location during checkout. WhatsApp: <a href="https://wa.me/2347031484486" target="_blank" style="color:var(--orange);font-weight:900">07031484486</a></span></div><main id="shop">
<div class="sectionhead"><div><div class="kicker">THE MARKETPLACE</div><h2>Discover artworks</h2><p class="muted sub">Browse original work and open an artwork page for its medium, size, price, availability and artist.</p></div></div>

<main id="kids"><div class="sectionhead"><div><div class="kicker">YOUNG CREATORS</div><h2>Shop from Kid Artists</h2><p class="muted sub">A dedicated space for artworks by younger creators. Artist age/status should be verified and parental/guardian consent handled before any real sale.</p></div></div><div class="grid" id="kidGrid"></div></main><main id="adults"><div class="sectionhead"><div><div class="kicker">ADULT ARTISTS</div><h2>Shop from Adult Artists</h2><p class="muted sub">Browse collections from adult artists and established creators.</p></div></div><div class="grid" id="adultGrid"></div></main><main id="artists">

<div class="filters"><input id="supplyQ" placeholder="Search materials..." oninput="loadSupplies()"><select id="supplyCat" onchange="loadSupplies()"><option value="">All categories</option><option>Paints</option><option>Brushes</option><option>Canvas</option><option>Paper</option><option>Tools</option><option>Easels</option></select></div>
<div class="grid" id="supplyGrid"></div>

<main id="become">

<div class="steps"><div class="step"><strong>1</strong><b>Create your account</b><p class="muted">Register with your name, email and password.</p></div><div class="step"><strong>2</strong><b>Build your artist profile</b><p class="muted">Tell collectors who you are and what you create.</p></div><div class="step"><strong>3</strong><b>List your artwork</b><p class="muted">Upload images, prices, medium and details for approval.</p></div></div>
<div class="panel" style="margin-top:16px"><b>Marketplace fees</b><p class="muted">The platform currently has configurable artist listing and sales commission settings. These should be reviewed before commercial launch.</p></div>

<main id="about"><div class="sectionhead"><div><div class="kicker">ABOUT US</div><h2>Art, creators & community</h2><p class="muted sub">AfricanArtistShop connects artists and art lovers with original artwork and useful creative materials.</p></div></div></main><main id="contact"><div class="sectionhead"><div><div class="kicker">CONTACT US</div><h2>We’re here to help</h2><p class="muted sub">For orders, artist applications or marketplace enquiries, use the contact details provided by the shop administrator.</p></div></div><div class="panel"><b>WhatsApp / Delivery</b><p class="muted">Your checkout captures your WhatsApp number and delivery address before the order is created.</p></div></main><main id="dashboard"><div class="sectionhead"><div><div class="kicker">YOUR SPACE</div><h2>Dashboard</h2></div></div><div id="dash" class="panel">Sign in to access your account.</div></main>

<section id="kid-register" class="register-note"><div><b>Register as a Kid Artist</b><p>For creators aged 12–16, registration should be completed with a parent/guardian involved. We can add guardian verification and consent before enabling sales.</p><button class="btn primary" onclick="openArtistApply()">Start application</button></div></section><section id="adult-register" class="register-note"><div><b>Register as a Professional Artist</b><p>Create an account, apply for your artist storefront and submit artworks for review.</p><button class="btn primary" onclick="openArtistApply()">Register as an Artist</button></div></section><footer><b>AfricanArtistShop</b><p>A marketplace for African art, artists and creators — connecting original work with collectors and putting quality art materials within reach.</p><small>Founded by Deji Arts</small></footer>

<div class="modal" id="modal"><div class="box"><button class="close" onclick="closeM()">×</button><div id="mb"></div></div></div>
<script>
let cart=JSON.parse(localStorage.getItem('aas_cart_v6')||'[]'); let ageFilter='kid'; let deliveryLocation=null;
const $=id=>document.getElementById(id),money=n=>'₦'+Number(n||0).toLocaleString('en-NG'),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function api(p,o={}){const r=await fetch('/api'+p,o);if(!r.ok)throw Error((await r.json().catch(()=>({error:r.statusText}))).error||'Request failed');return r.json()}
function openM(){ $('modal').classList.add('open') } function closeM(){ $('modal').classList.remove('open') }
function syncSearch(v){$('q').value=v;$('sq').value=v;loadArt()}
function setAge(a){ageFilter=a;['kidTab','adultTab','allTab'].forEach(x=>$(x).classList.remove('active'));$(a==='kid'?'kidTab':a==='adult'?'adultTab':'allTab').classList.add('active');loadArt();loadArtists()} async function loadArt(){try{const q=$('sq').value,m=$('m').value,age=ageFilter==='all'?'':ageFilter;const a=await api('/artworks?q='+encodeURIComponent(q)+'&medium='+encodeURIComponent(m)+'&age='+encodeURIComponent(age));$('arts').innerHTML=a.map(artCard).join('')||'<div class="empty">No approved artworks match that search yet.</div>'}catch(e){$('arts').innerHTML='<div class="empty">The artwork catalogue could not be loaded.</div>'}}
function artCard(x){return '<article class="card"><img src="'+esc(x.image_url)+'" alt="'+esc(x.title)+'"><div class="body"><span class="pill">'+esc(x.medium)+'</span><h3>'+esc(x.title)+'</h3><p class="muted">'+esc(x.artist_name==='Peace'?'Peace Mojibola':x.artist_name)+' · '+esc(x.size||'Size on request')+'</p><div class="price">'+money(x.price)+'</div><div class="actions"><button class="btn" onclick="product('+x.id+')">View artwork</button><button class="btn primary" onclick="addArt('+x.id+')">Add to cart</button></div></div></article>'}
async function loadAgeGroups(){try{const a=await api('/artists');const cards=(arr)=>arr.map(x=>'<article class="card"><img src="'+esc(x.image_url||'https://images.unsplash.com/photo-1577083288073-40892c0860a4?auto=format&fit=crop&w=900&q=80')+'"><div class="body"><span class="pill">'+esc(x.specialty||'Artist')+'</span><h3>'+esc(x.name==='Peace'?'Peace Mojibola':x.name)+'</h3><p class="muted">'+esc(x.bio||'Artist storefront')+'</p><button class="btn primary" onclick="artist('+x.id+')">Shop this artist</button></div></article>').join('');$('kidGrid').innerHTML=cards(a.filter(x=>/kid|young|12|13|14|15|16/i.test((x.specialty||'')+' '+(x.bio||''))))||'<div class="empty">Young artist collections will appear here after verified kid-artist profiles are approved.</div>';$('adultGrid').innerHTML=cards(a.filter(x=>!/kid|young|12|13|14|15|16/i.test((x.specialty||'')+' '+(x.bio||''))))||'<div class="empty">Adult artist collections will appear here.</div>'}catch(e){}}async function loadArtists(){try{const a=await api('/artists');$('artistGrid').innerHTML=a.map(x=>'<article class="card"><img src="'+esc(x.image_url||'https://images.unsplash.com/photo-1577083288073-40892c0860a4?auto=format&fit=crop&w=900&q=80')+'" alt="'+esc(x.name)+'"><div class="body"><span class="pill">'+esc(x.specialty||'African artist')+'</span><h3>'+esc(x.name)+'</h3><p class="muted">'+esc(x.bio||'Independent artist')+'</p><button class="btn" onclick="artist('+x.id+')">Open artist shop</button></div></article>').join('')||'<div class="empty">Approved artists will appear here.</div>'}catch(e){$('artistGrid').innerHTML='<div class="empty">Artists could not be loaded.</div>'}}
async function loadSupplies(){try{let q=encodeURIComponent($('supplyQ').value),a=await api('/supplies?q='+q);const cat=$('supplyCat').value;if(cat)a=a.filter(x=>x.category===cat);$('supplyGrid').innerHTML=a.map(supplyCard).join('')||'<div class="empty">No materials found.</div>'}catch(e){$('supplyGrid').innerHTML='<div class="empty">The materials shop could not be loaded.</div>'}}
function supplyCard(x){return '<article class="card"><img src="'+esc(x.image_url)+'" alt="'+esc(x.name)+'"><div class="body"><span class="pill">'+esc(x.category)+'</span><h3>'+esc(x.name)+'</h3><p class="muted">'+esc(x.description)+'</p><div class="price">'+money(x.price)+'</div><p class="muted">'+(x.stock>0?x.stock+' in stock':'Out of stock')+' · per '+esc(x.unit)+'</p><button class="btn primary" '+(x.stock<1?'disabled':'')+' onclick="addSupply('+x.id+')">Add to cart</button></div></article>'}
async function product(id){const x=await api('/artworks/'+id);$('mb').innerHTML='<div class="two"><img src="'+esc(x.image_url)+'" alt="'+esc(x.title)+'"><div><span class="pill">'+esc(x.medium)+'</span><h2>'+esc(x.title)+'</h2><p class="muted">by '+esc(x.artist_name)+'</p><h2>'+money(x.price)+'</h2><p>'+esc(x.description||'')+'</p><p><b>Size:</b> '+esc(x.size||'Not specified')+'<br><b>Availability:</b> '+esc(x.availability||'Available')+'</p><button class="btn primary" onclick="addArt('+x.id+');closeM()">Add to cart</button> <button class="btn" onclick="wa('+x.id+')">WhatsApp enquiry</button></div></div>';openM()}
async function wa(id){const x=await api('/artworks/'+id);window.open('https://wa.me/'+SHOP_WHATSAPP+'?text='+encodeURIComponent('Hello AfricanArtistShop, I am interested in “'+x.title+'” by '+x.artist_name+'. Price: '+money(x.price)+'. Please send me more information.'),'_blank')}
async function artist(id){const x=await api('/artists/'+id);$('mb').innerHTML='<div class="two"><img src="'+esc(x.image_url||'')+'" alt="'+esc(x.name)+'"><div><div class="kicker">ARTIST STOREFRONT</div><h2>'+esc(x.name)+'</h2><p><b>'+esc(x.specialty||'African artist')+'</b></p><p class="muted">'+esc(x.bio||'')+'</p><h3>Available collection</h3><div class="grid">'+(x.artworks||[]).map(a=>'<div class="card"><img src="'+esc(a.image_url)+'"><div class="body"><b>'+esc(a.title)+'</b><div class="price">'+money(a.price)+'</div><button class="btn primary" onclick="addArt('+a.id+');closeM()">Add to cart</button></div></div>').join('')+'</div></div></div>';openM()}
async function addArt(id){const x=await api('/artworks/'+id);const found=cart.find(i=>i.type==='art'&&i.id===x.id);if(found)found.quantity++;else cart.push({type:'art',id:x.id,title:x.title,price:x.price,image:x.image_url,quantity:1});saveCart();toast('Artwork added to cart')}
async function addSupply(id){const x=await api('/supplies/'+id);const found=cart.find(i=>i.type==='supply'&&i.id===x.id);if(found)found.quantity=Math.min(found.quantity+1,x.stock);else cart.push({type:'supply',id:x.id,title:x.name,price:x.price,image:x.image_url,quantity:1});saveCart();toast('Material added to cart')}
function saveCart(){localStorage.setItem('aas_cart_v6',JSON.stringify(cart));$('cc').textContent=cart.reduce((n,x)=>n+x.quantity,0)}
const SHOP_WHATSAPP='2347031484486';
function openCart(){renderCart();openM()}
function renderCart(){const total=cart.reduce((s,x)=>s+x.price*x.quantity,0);$('mb').innerHTML='<h2>Your cart</h2>'+(cart.length?cart.map((x,i)=>'<div class="cartrow"><img src="'+esc(x.image)+'"><div class="grow"><b>'+esc(x.title)+'</b><div class="muted">'+(x.type==='art'?'Artwork':'Art material')+' · '+money(x.price)+'</div></div><div class="qty"><button onclick="qty('+i+',-1)">−</button><b>'+x.quantity+'</b><button onclick="qty('+i+',1)">+</button></div><button class="iconbtn" onclick="removeCart('+i+')">Remove</button></div>').join('')+'<h2>Total: '+money(total)+'</h2><button class="btn primary" onclick="checkout()">Continue to order</button>':'<div class="empty">Your cart is empty.<br><br><a class="btn primary" href="#shop" onclick="closeM()">Explore the marketplace</a></div>');}
function qty(i,d){cart[i].quantity=Math.max(1,cart[i].quantity+d);saveCart();renderCart()}
function removeCart(i){cart.splice(i,1);saveCart();renderCart()}
async function checkout(){if(!cart.length)return;$('mb').innerHTML='<h2>Delivery details</h2><p class="muted">Enter the phone/WhatsApp number for delivery updates and optionally share your current location.</p><div class="form"><input id="dn" placeholder="Full name"><input id="de" type="email" placeholder="Email"><input id="dw" placeholder="WhatsApp / phone number"><textarea id="da" placeholder="Delivery address / landmark"></textarea><button class="btn" onclick="getLocation()">📍 Use my current location</button><p id="locmsg" class="muted"></p><button class="btn primary" onclick="submitCheckout()">Send order & delivery details</button></div>';openM()} async function getLocation(){if(!navigator.geolocation){$('locmsg').textContent='Location sharing is not supported.';return}navigator.geolocation.getCurrentPosition(p=>{deliveryLocation={lat:p.coords.latitude,lng:p.coords.longitude};$('locmsg').textContent='Location captured.'},()=>{$('locmsg').textContent='Location permission was not granted.'},{enableHighAccuracy:true,timeout:10000})} async function submitCheckout(){const name=$('dn').value,email=$('de').value,whatsapp=$('dw').value,address=$('da').value;if(!name||!email||!whatsapp)return alert('Please enter your name, email and phone/WhatsApp number.');try{const o=await api('/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_name:name,customer_email:email,whatsapp,address,items:cart.map(x=>({type:x.type,id:x.id,quantity:x.quantity}))})});const loc=deliveryLocation?('\\nDelivery GPS: https://maps.google.com/?q='+deliveryLocation.lat+','+deliveryLocation.lng):''; const text='Hello AfricanArtistShop, I would like to place order #'+o.order_id+'. Total: '+money(o.total)+'\\nCustomer: '+name+'\\nPhone/WhatsApp: '+whatsapp+'\\nAddress: '+(address||'Not supplied')+loc+'\\nPlease confirm payment and delivery.';window.open('https://wa.me/'+SHOP_WHATSAPP+'?text='+encodeURIComponent(text),'_blank');cart=[];saveCart();closeM();alert('Order created successfully. WhatsApp has been opened for confirmation.')}catch(e){alert(e.message)}}
function openAuth(){ $('mb').innerHTML='<h2>Account</h2><p class="muted">Create a customer account or sign in to manage your marketplace activity.</p><div class="form"><input id="an" placeholder="Name (for registration)"><input id="ae" type="email" placeholder="Email"><input id="ap" type="password" placeholder="Password"><button class="btn primary" onclick="reg()">Create account</button><button class="btn" onclick="login()">Login</button></div>';openM()}
async function reg(){try{const u=await api('/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('an').value,email:$('ae').value,password:$('ap').value})});closeM();refreshDash(u)}catch(e){alert(e.message)}}
async function login(){try{const u=await api('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('ae').value,password:$('ap').value})});closeM();refreshDash(u)}catch(e){alert(e.message)}}
async function refreshDash(u){$('dashboard').scrollIntoView({behavior:'smooth'});if(u.role==='artist'){const d=await api('/artist/dashboard');$('dash').innerHTML='<h3>Welcome, '+esc(u.name)+'</h3><p>Artist status: <b>'+esc(d.artist?.status||'pending')+'</b></p><div class="stats"><div class="stat"><b>'+money(d.listing_fee)+'</b><span class="muted">Current listing fee</span></div><div class="stat"><b>'+d.commission_percent+'%</b><span class="muted">Sales commission</span></div><div class="stat"><b>'+d.artworks.length+'</b><span class="muted">Your listings</span></div><div class="stat"><b>'+d.orders.length+'</b><span class="muted">Order lines</span></div></div><hr><h3>Submit a new artwork</h3><form class="form" onsubmit="uploadArt(event)"><input id="at" required placeholder="Artwork title"><input id="am" required placeholder="Medium"><input id="asz" placeholder="Size"><input id="aprice" required type="number" min="0" placeholder="Price in NGN"><select id="aage"><option value="kid">Kids • 12–16</option><option value="adult" selected>Adults • 17+</option></select><textarea id="ad" placeholder="Description"></textarea><input id="ai" required type="file" accept="image/*"><button class="btn primary">Submit artwork for review</button></form><hr><h3>Your listings</h3>'+(d.artworks.map(a=>'<p><b>'+esc(a.title)+'</b> — '+esc(a.status)+' — '+money(a.price)+'</p>').join('')||'<p class="muted">No listings yet.</p>')}else if(u.role==='admin'){const s=await api('/admin/stats');$('dash').innerHTML='<h3>Admin dashboard</h3><div class="stats"><div class="stat"><b>'+s.users+'</b><span>Users</span></div><div class="stat"><b>'+s.artists+'</b><span>Artists</span></div><div class="stat"><b>'+s.artworks+'</b><span>Artworks</span></div><div class="stat"><b>'+s.supplies+'</b><span>Materials</span></div></div><p class="muted">Moderation and inventory APIs are active on the marketplace backend.</p>'}else{$('dash').innerHTML='<h3>Welcome, '+esc(u.name)+'</h3><p>Your customer account is active. Orders you create are recorded here.</p><button class="btn" onclick="loadOrders()">View my orders</button><div id="orders"></div>'}}
async function loadOrders(){const o=await api('/orders');$('orders').innerHTML='<h3>Orders</h3>'+(o.map(x=>'<div class="panel" style="margin:8px 0"><b>Order #'+x.id+'</b> · '+money(x.total)+' · '+esc(x.status)+'<br><small>'+esc(x.created_at)+'</small></div>').join('')||'<p class="muted">No orders yet.</p>')}
async function uploadArt(e){e.preventDefault();const f=new FormData();f.append('title',$('at').value);f.append('medium',$('am').value);f.append('size',$('asz').value);f.append('price',$('aprice').value);f.append('age_group',$('aage').value);f.append('description',$('ad').value);f.append('image',$('ai').files[0]);try{await fetch('/api/artist/artworks',{method:'POST',body:f}).then(async r=>{if(!r.ok)throw Error((await r.json()).error)});alert('Artwork submitted for admin review.');refresh()}catch(e){alert(e.message)}}
async function openArtistApply(){try{const u=(await api('/me')).user;if(!u){openAuth();return}$('mb').innerHTML='<h2>Become an Artist</h2><p class="muted">Apply for an artist storefront. Your profile is reviewed before it becomes public.</p><form class="form" onsubmit="applyArtist(event)"><input id="pn" required placeholder="Artist / studio name"><input id="ps" required placeholder="Specialty"><textarea id="pb" placeholder="Biography and artistic story"></textarea><input id="pi" placeholder="Profile image URL (optional)"><button class="btn primary">Submit artist application</button></form>';openM()}catch(e){alert(e.message)}}
async function applyArtist(e){e.preventDefault();try{const r=await api('/artist/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('pn').value,specialty:$('ps').value,bio:$('pb').value,image_url:$('pi').value})});alert('Application submitted. Status: '+r.status);closeM();refresh()}catch(e){alert(e.message)}}
async function refresh(){try{const u=(await api('/me')).user;if(u)refreshDash(u)}catch(e){}}
function toast(t){const x=document.createElement('div');x.textContent=t;x.style='position:fixed;right:18px;bottom:18px;background:#171513;color:white;padding:13px 18px;border-radius:12px;z-index:200;box-shadow:0 10px 30px #0004';document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}
loadArt();loadArtists();loadAgeGroups();loadSupplies();saveCart();refresh();
</script>
<script>
async function loadSeparatedArtists(){try{const a=await api('/artists');const card=x=>'<article class="card"><img src="'+esc(x.image_url||'https://images.unsplash.com/photo-1577083288073-40892c0860a4?auto=format&fit=crop&w=900&q=80')+'"><div class="body"><span class="pill">'+(x.age_group==='12-16'?'Kid Artist · 12–16':'Professional Artist')+'</span><h3>'+esc(x.name)+'</h3><p class="muted">'+esc(x.specialty||'Artist')+'</p><button class="btn primary" onclick="artist('+x.id+')">Shop this artist</button></div></article>';document.getElementById('kidGrid').innerHTML=a.filter(x=>x.age_group==='12-16'||x.artist_type==='kid').map(card).join('')||'<div class="empty">No kid artists yet.</div>';document.getElementById('proGrid').innerHTML=a.filter(x=>x.age_group!=='12-16'&&x.artist_type!=='kid').map(card).join('')||'<div class="empty">No professional artists yet.</div>'}catch(e){}}
function openArtistApplyKid(){openArtistForm('kid')} function openArtistApplyPro(){openArtistForm('professional')}
function openArtistForm(kind){$('mb').innerHTML='<h2>'+(kind==='kid'?'Register as a Kid Artist':'Register as a Professional Artist')+'</h2><p class="muted">'+(kind==='kid'?'For ages 12–16. Parent/guardian consent and supervision are required.':'For adult artists.')+'</p><form class="form" onsubmit="submitArtist(event,\\'"+kind+"\\')"><input id="rn" required placeholder="Artist name"><input id="rs" required placeholder="Specialty"><textarea id="rb" placeholder="Biography"></textarea><input id="ri" placeholder="Profile image URL (optional)">'+(kind==='kid'?'<input id="rg" required placeholder="Parent/guardian name"><input id="rp" required placeholder="Parent/guardian phone">':'')+'<button class="btn primary">Submit registration</button></form>';openM()}
async function submitArtist(e,kind){e.preventDefault();try{const u=(await api('/me')).user;if(!u){openAuth();return}await api('/artist/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('rn').value,specialty:$('rs').value,bio:$('rb').value,image_url:$('ri').value,artist_type:kind,age_group:kind==='kid'?'12-16':'adult',guardian_name:kind==='kid'?$('rg').value:'',guardian_phone:kind==='kid'?$('rp').value:''})});alert('Registration submitted for review.');closeM();loadSeparatedArtists()}catch(e){alert(e.message)}}
loadSeparatedArtists();
</script></body>
</html>
